apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: hw5
type: Opaque
# Public credentials for this local homework stand only.
stringData:
  S3_ACCESS_KEY: hhadmin
  S3_SECRET_KEY: hhadmin-secret
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hw5-config
  namespace: hw5
data:
  S3_BACKEND: boto3
  S3_ENDPOINT: http://rustfs.hw5.svc.cluster.local:9000
  S3_BUCKET: hh-lake
  S3_REGION: us-east-1
  VACANCIES_KEY: raw/vacancies.csv
  VARIANT_FILTER_MODE: role
