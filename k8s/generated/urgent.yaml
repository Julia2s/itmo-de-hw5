apiVersion: batch/v1
kind: Job
metadata:
  name: urgent
  namespace: hw5
  labels:
    app: skills-experiment
    experiment: urgent
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: skills-experiment
        experiment: urgent
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
      - name: worker
        image: hw5-skills:local
        imagePullPolicy: Never
        command:
        - python
        - src/worker.py
        args:
        - --mode
        - sequential
        - --prefix
        - hw5/urgent
        env:
        - name: S3_ENDPOINT
          value: http://rustfs.hw5.svc.cluster.local:9000
        envFrom:
        - configMapRef:
            name: hw5-config
        - secretRef:
            name: s3-credentials
        resources:
          requests:
            cpu: 1680m
            memory: 1Gi
          limits:
            cpu: 1680m
            memory: 1Gi
      terminationGracePeriodSeconds: 10
      nodeSelector:
        kubernetes.io/hostname: hw5
      priorityClassName: hw5-high
