apiVersion: batch/v1
kind: Job
metadata:
  name: low-reduce
  namespace: hw5
  labels:
    app: skills-experiment
    experiment: low
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
      - name: worker
        image: hw5-skills:local
        imagePullPolicy: Never
        command:
        - python
        - src/reduce.py
        args:
        - --prefix
        - hw5/low
        envFrom:
        - configMapRef:
            name: hw5-config
        - secretRef:
            name: s3-credentials
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 500m
            memory: 1Gi
      terminationGracePeriodSeconds: 10
      nodeSelector:
        kubernetes.io/hostname: hw5
      priorityClassName: hw5-low
    metadata:
      labels:
        app: skills-experiment
        experiment: low
